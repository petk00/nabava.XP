# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /usr/share/nginx/html;
    index index.html;

    # AI asistent (docs/AI.md) — MORA biti prije općeg /api/ bloka po duljini
    # prefiksa. Jedan potez razgovora zna legitimno trajati minutama: lokalni
    # Ollama/gemma4:12b ima izmjerene medijane latencije 100-900s po scenariju
    # (docs/eval-runs/aggregate-summary.md), a sam backend čeka do 10 min po
    # pozivu modelu (ollamaProvider.js REQUEST_TIMEOUT_MS). S nginx defaultom
    # od 60s (koliko vrijedi za ostatak /api/) kroz Docker deployment bi
    # praktički SVAKI poziv asistentu vratio 504 — eval harness to nije uhvatio
    # jer gađa backend izravno na :3000, zaobilazeći nginx.
    # 660s se namjerno poklapa s CHAT_FETCH_TIMEOUT_MS u scripts/evalHarness.js,
    # da mjerenje kroz harness i stvarni put kroz nginx imaju isti budžet.
    location /api/assistant/ {
        # Uz poruku ide do 5 priloga x 5 MB (assistantRoutes.js MAX_QUOTE_FILES
        # / MAX_QUOTE_FILE_SIZE), dakle ~25 MB multipart tijela — s 10m koliko
        # vrijedi za ostatak /api/ upload tri veće ponude odjednom pada na 413
        # prije nego uopće dođe do multera. Vrijedi samo za PRVI potez (upload);
        # kasniji potezi su čist JSON jer bajtovi priloga ostaju server-side
        # (assistantAttachmentStore.js).
        client_max_body_size 26m;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }

    # Proksi /api/ pozivi na backend (puna putanja se prosljeđuje)
    location /api/ {
        # Upload dokumenata dopušta 10 MB (multer limit na backendu);
        # nginx default je 1 MB pa bi veće datoteke padale s 413.
        client_max_body_size 10m;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
