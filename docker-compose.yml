services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Postavi DB_ROOT_PASSWORD u .env datoteci u korijenu projekta}
      MYSQL_DATABASE: XP
      MYSQL_USER: veleri
      MYSQL_PASSWORD: ${DB_PASSWORD:?Postavi DB_PASSWORD u .env datoteci u korijenu projekta}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  backend:
    build: ./server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: veleri
      DB_PASSWORD: ${DB_PASSWORD:?Postavi DB_PASSWORD u .env datoteci u korijenu projekta}
      DB_NAME: XP
      JWT_SECRET: ${JWT_SECRET:?Postavi JWT_SECRET u .env datoteci u korijenu projekta (openssl rand -base64 48)}
      JWT_EXPIRES_IN: 1d
      CLIENT_URL: https://${SERVER_IP:-localhost}
      UPLOADS_DIR: /app/uploads
      # AI asistent (docs/AI.md). Aktivni provider je runtime postavka u
      # tablici AppSetting (PUT /api/assistant/settings), ali ADRESA Ollame i
      # Gemini ključ moraju doći iz okoline — bez njih asistent u kontejneru
      # ne može raditi ni s jednim providerom (unutar kontejnera "localhost"
      # je sam kontejner, ne host).
      #   - Ollama na HOSTU (uobičajeno, zbog GPU-a): ostavi default ispod.
      #   - Ollama kao kontejner: pokreni s `--profile ollama` i u .env
      #     postavi OLLAMA_BASE_URL=http://ollama:11434
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # SMTP_HOST: smtp.office365.com
      # SMTP_PORT: 587
      # SMTP_USER: your-email@veleri.hr
      # SMTP_PASS: your-password
      # SMTP_FROM: "veleri.XP <your-email@veleri.hr>"
    volumes:
      - uploads:/app/uploads
    # Da default OLLAMA_BASE_URL (host.docker.internal) radi i na Linuxu —
    # na macOS/Windows Docker Desktop to ime postoji samo od sebe, na Linuxu ne.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Port 3000 nije izložen na hostu — backend je dostupan unutar Docker
    # mreže, proxiran kroz nginx (/api/). Za debug: ports: ['127.0.0.1:3000:3000']

  frontend:
    build:
      context: ./client
      args:
        API_URL: https://${SERVER_IP:-localhost}/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"

  # Opcionalno — Ollama kao kontejner umjesto servisa na hostu (docs/AI.md,
  # docs/DEPLOYMENT.md). Ne pokreće se u običnom `docker compose up`, nego samo
  # uz `docker compose --profile ollama up -d`; namjerno, jer slika i model
  # (gemma4:e4b, ~9.6 GB) su velikima za deployment koji AI asistenta ne koristi,
  # a bez GPU-a je generiranje presporo za stvarnu upotrebu.
  # Nakon prvog pokretanja model treba jednom povući:
  #   docker compose exec ollama ollama pull gemma4:e4b
  # Ako se katalog (server/src/services/llm/ollamaModels.js) proširi, svaki
  # dodani model treba jednom povući na isti način.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # Port 11434 nije izložen na hostu — backend mu pristupa unutar Docker
    # mreže (u .env postaviti OLLAMA_BASE_URL=http://ollama:11434).

volumes:
  mysql_data:
  uploads:
  ollama_models:
